name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Avisa a Bing (y a los demás buscadores de IndexNow) de las páginas que cambiaron en este push.
  # La llave vive en la raíz del sitio (c9f3de08b0664ada8a3edd0f6cd43475.txt); no es secreta.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ping IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          KEY: c9f3de08b0664ada8a3edd0f6cd43475
        run: |
          sleep 60   # que GitHub Pages ya sirva la versión nueva
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            CAMBIOS=$(git diff --name-only "$BEFORE" HEAD)
          else
            CAMBIOS=$(git ls-files)
          fi
          URLS=$(echo "$CAMBIOS" | grep -E '(^|/)index\.html$' | grep -vE '^(reports|tools)/' \
            | sed -E 's#index\.html$##; s#^#https://landing.apto.mx/#' | sort -u)
          if [ -z "$URLS" ]; then echo "Sin páginas cambiadas"; exit 0; fi
          echo "$URLS"
          LISTA=$(echo "$URLS" | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -sS -o /dev/null -w "IndexNow %{http_code}\n" -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"landing.apto.mx\",\"key\":\"$KEY\",\"keyLocation\":\"https://landing.apto.mx/$KEY.txt\",\"urlList\":$LISTA}" \
            https://api.indexnow.org/indexnow
